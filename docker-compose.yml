services:
  nginx:
    image: nginx:1.27-alpine
    container_name: trabajaya-lb
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
    restart: unless-stopped
    networks:
      - trabajaya-net

  app-1:
    build: .
    container_name: trabajaya-app-1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=app-1
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://trabajaya:${POSTGRES_PASSWORD:-trabajaya_dev}@postgres:5432/trabajaya_db
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - trabajaya-net

  app-2:
    build: .
    container_name: trabajaya-app-2
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=app-2
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://trabajaya:${POSTGRES_PASSWORD:-trabajaya_dev}@postgres:5432/trabajaya_db
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - trabajaya-net

  redis:
    image: redis:7-alpine
    container_name: trabajaya-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks:
      - trabajaya-net

  postgres:
    image: postgres:16-alpine
    container_name: trabajaya-postgres
    environment:
      - POSTGRES_DB=trabajaya_db
      - POSTGRES_USER=trabajaya
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trabajaya_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped
    networks:
      - trabajaya-net

volumes:
  pg_data:

networks:
  trabajaya-net:
    driver: bridge
