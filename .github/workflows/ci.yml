name: CI — Calidad, Pruebas Jest + Cobertura, Carga 2000 VUs, E2E y Build (TrabajaYa Perú)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint + Jest (Unit & Integration + Coverage) + Load 2000 VUs + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Verificación de tipos TypeScript (tsc --noEmit)
        run: npm run lint

      - name: Pruebas Automatizadas Jest + Reporte de Cobertura (Unit + Integration + OpenAPI)
        run: npm run test:coverage

      - name: Subir reporte de cobertura Jest (HTML + LCOV + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          retention-days: 14

      - name: Validación de Atributos de Calidad — Simulación progresiva hasta 2,000 VUs
        run: npm run test:load

      - name: Subir evidencia de rendimiento (2,000 VUs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-2000vu-evidence
          path: docs/evidencias/load-2000vu-results.json
          retention-days: 14

      - name: Build de producción (Vite Code Splitting)
        run: npm run build

      - name: Guardar artefacto dist/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  e2e-playwright:
    name: Pruebas End-to-End (Playwright Chromium)
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar suite E2E (6 escenarios)
        run: npm run test:e2e

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-verify:
    name: Validación de Imagen Docker Multi-Stage
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Compilar imagen Docker
        run: docker build -t trabajaya-peru:ci-${{ github.sha }} .
