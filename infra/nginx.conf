# ==============================================================================
# Nginx Load Balancer + Reverse Proxy (HTTP + WebSocket + Gzip + Rate Limit)
# ==============================================================================

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Compresión Gzip para JSON, JS, CSS y SVG
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Rate limiting perimetral por IP (protección L7)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=5r/s;

    # Clúster horizontal de instancias Node.js (algoritmo least_conn)
    upstream trabajaya_cluster {
        least_conn;
        server app-1:3000 max_fails=3 fail_timeout=15s;
        server app-2:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name trabajaya.pe www.trabajaya.pe;

        client_max_body_size 2m;

        # Cabeceras de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Assets estáticos con hash: caché agresiva inmutable (1 año)
        location /assets/ {
            proxy_pass http://trabajaya_cluster;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Endpoint de pagos Culqi con rate limit estricto
        location /api/payments/culqi/charge {
            limit_req zone=payment_limit burst=10 nodelay;
            proxy_pass http://trabajaya_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API REST general
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://trabajaya_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket en tiempo real (/ws/chat)
        location /ws/chat {
            proxy_pass http://trabajaya_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA React 19
        location / {
            proxy_pass http://trabajaya_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
