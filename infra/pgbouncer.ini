; ==============================================================================
; PgBouncer — Connection Pooling para PostgreSQL 16 (TrabajaYa Perú)
; Modo 'transaction' permite miles de conexiones Node.js sobre un pool reducido
; ==============================================================================

[databases]
trabajaya_db = host=postgres-primary port=5432 dbname=trabajaya_db
trabajaya_ro = host=postgres-replica port=5432 dbname=trabajaya_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 300
query_wait_timeout = 15

ignore_startup_parameters = extra_float_digits
admin_users = trabajaya_admin
stats_users = trabajaya_monitor
