  <text x="24" y="49" font-size="11.5" fill="#64748B">Difusión instantánea de eventos chat:conversation y chat:message con idempotencia por messageId</text>
  <text x="1096" y="28" font-size="11" fill="#64748B" text-anchor="end">Patrón de comportamiento · v2.0</text>
  
  
