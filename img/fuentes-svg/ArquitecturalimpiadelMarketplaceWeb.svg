  <text x="626" y="710" font-size="10" fill="#334155">1. El Dominio (src/types/, src/domain/businessRules.ts) no importa librerías de UI ni servidor.</text>
  <text x="626" y="726" font-size="10" fill="#334155">2. Los casos de uso operan sobre contratos y entidades del dominio.</text>
  <text x="626" y="742" font-size="10" fill="#334155">3. Los adaptadores (Culqi, Caché LRU/Redis, SMTP, WhatsApp) son intercambiables vía composición.</text>
  <text x="626" y="758" font-size="10" fill="#334155">4. Todo cambio se verifica automáticamente en CI (tsc + 36 pruebas Vitest/Supertest + 6 E2E).</text>
  
