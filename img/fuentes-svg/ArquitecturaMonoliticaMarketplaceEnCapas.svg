  <rect x="40" y="758" width="54" height="14" fill="none" stroke="#64748B" stroke-dasharray="4 3"/><text x="105" y="769" font-size="9.8" fill="#334155">Límite de módulo dentro del monolito modular</text>
  <rect x="40" y="778" width="54" height="14" fill="#E5E7EB" stroke="#475569"/><text x="105" y="789" font-size="9.8" fill="#334155">Sistema externo (integrado con degradación elegante)</text>

  <rect x="756" y="704" width="536" height="94" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="770" y="724" font-size="11" font-weight="700" fill="#1E293B">Reglas de la arquitectura</text>
  <text x="770" y="742" font-size="9.8" fill="#334155">1. Cada capa solo invoca a la capa inmediatamente inferior o contratos del dominio.</text>
  <text x="770" y="758" font-size="9.8" fill="#334155">2. Toda escritura de pagos o chat invalida su clave en server/cache.ts.</text>
  <text x="770" y="774" font-size="9.8" fill="#334155">3. Despliegue unificado replicable (app-1, app-2) detrás de Nginx + Redis + PostgreSQL.</text>
  
