  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6D4AA8"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
  <marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#FFFFFF" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="d" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#475569"/></marker>
</defs>
  <rect width="1320" height="820" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#1E293B">«monolito» TrabajaYa Perú Backend &amp; Frontend [Node.js 22 LTS · Express 4 · React 19]</text>
  <text x="24" y="49" font-size="11.5" fill="#64748B">Una sola unidad desplegable con fronteras modulares estrictas y 3 capas internas</text>
  <text x="1296" y="28" font-size="11" fill="#64748B" text-anchor="end">Estilo arquitectónico · v2.0</text>
  
  <!-- Actores arriba -->
  <rect x="405" y="62" width="100" height="36" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3"/><text x="455" y="84" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Cliente Hogar</text>
  <rect x="555" y="62" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3"/><text x="615" y="84" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Técnico Ofertante</text>
  <rect x="725" y="62" width="115" height="36" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3"/><text x="782" y="84" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Admin (ADM-001)</text>
  <path d="M455,98 L455,112 L782,112 L782,98 M615,98 L615,122" fill="none" stroke="#1E293B" stroke-width="1.3"/>
  <rect x="430" y="122" width="370" height="40" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.4"/>
  <text x="615" y="139" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">Cliente Web SPA (React 19 + Tailwind v4 + Vite 8)</text>
  <text x="615" y="154" font-size="9.5" fill="#475569" text-anchor="middle">[Nginx Load Balancer least_conn · Cloudflare CDN]</text>
  <path d="M615,162 L615,204" fill="none" stroke="#475569" stroke-width="1.45" marker-end="url(#a)"/><text x="720" y="186" font-size="9.5" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.5">HTTPS JSON /api/* · WSS /ws/chat</text>

  <!-- Límite del monolito -->
  <rect x="26" y="206" width="1040" height="432" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6" stroke-dasharray="8 5"/>

  <!-- Capa 1 Presentación -->
  <rect x="38" y="220" width="1016" height="148" fill="#EAF1FB" stroke="#2F5FA7" stroke-width="1.2"/>
  <text x="50" y="248" font-size="11.5" font-weight="700" fill="#1E3A8A">1. CAPA DE</text>
  <text x="50" y="264" font-size="11.5" font-weight="700" fill="#1E3A8A">PRESENTACIÓN</text>
  <text x="50" y="286" font-size="9.5" fill="#334155">Recibe HTTP/WS,</text>
  <text x="50" y="300" font-size="9.5" fill="#334155">valida entrada,</text>
  <text x="50" y="314" font-size="9.5" fill="#334155">aplica Rate Limit</text>
  <text x="50" y="328" font-size="9.5" fill="#334155">y responde JSON.</text>

  <rect x="170" y="228" width="870" height="24" rx="4" fill="#DBEAFE" stroke="#2F5FA7" stroke-width="1"/>
  <text x="605" y="244" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="middle">Middlewares Express (transversales): express.json(2mb) · Security Headers · X-Instance-Id · Rate Limiter (429) · Static immutable</text>

  <!-- Capa 2 Lógica de negocio -->
  <rect x="38" y="378" width="1016" height="114" fill="#E8F3EC" stroke="#2F7D4F" stroke-width="1.2"/>
  <text x="50" y="408" font-size="11.5" font-weight="700" fill="#166534">2. LÓGICA DE</text>
  <text x="50" y="424" font-size="11.5" font-weight="700" fill="#166534">NEGOCIO</text>
  <text x="50" y="446" font-size="9.5" fill="#334155">Reglas Escrow 10%,</text>
  <text x="50" y="460" font-size="9.5" fill="#334155">IGV 18%, RBAC y</text>
  <text x="50" y="474" font-size="9.5" fill="#334155">coordinación.</text>

  <!-- Capa 3 Datos y Caché -->
  <rect x="38" y="502" width="1016" height="126" fill="#FDF3E3" stroke="#B7791F" stroke-width="1.2"/>
  <text x="50" y="534" font-size="11.5" font-weight="700" fill="#92400E">3. CAPA DE</text>
  <text x="50" y="550" font-size="11.5" font-weight="700" fill="#92400E">DATOS &amp; CACHÉ</text>
  <text x="50" y="572" font-size="9.5" fill="#334155">Caché LRU/ETag,</text>
  <text x="50" y="586" font-size="9.5" fill="#334155">archivos .data/</text>
  <text x="50" y="600" font-size="9.5" fill="#334155">y PostgreSQL 16.</text>

