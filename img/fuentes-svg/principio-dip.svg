  <text x="24" y="49" font-size="11.5" fill="#64748B">Los controladores de alto nivel dependen de la abstracción CacheStore, no de la implementación concreta</text>
  <text x="1096" y="28" font-size="11" fill="#64748B" text-anchor="end">SOLID · Principio D</text>
  
  
